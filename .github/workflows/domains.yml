name: DomainsRenew

on:
  schedule:
    # 每10天运行：1号、11号、21号 中午12:12 (北京时间)
    # UTC 时间 = 北京时间 - 8小时 = 04:12
    - cron: '1 1 1 * *'
  workflow_dispatch:

jobs:
  keepalive:
    name: Run Jobs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    concurrency:
      group: browser-login
      cancel-in-progress: false

    steps:
      - name: checkout Repository
        uses: actions/checkout@v4

      - name: Setting Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Perform Task
        env:
          PASSWORD: ${{ secrets.PASSWORD }}
          TG_API: ${{ vars.TG_API }}
        run: |
          curl -sL https://dg.str.xx.kg?accounts.json -o accounts.json
          python domains_update.py



      - name: Clean Jobs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 3
