name: 上传文件测试

on:
  schedule:
    # 每10天运行：1号、11号、21号 中午12:12 (北京时间)
    # UTC 时间 = 北京时间 - 8小时 = 04:12
    - cron: '32 9 * * 1'
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    
    # 🌟 必须添加以下权限，否则 Action 没有权限推送到你的仓库
    permissions:
      contents: write
      actions: write

    steps:
    - name: 检出代码
      uses: actions/checkout@v7
    - run: |
        set -e
        echo ${{ secrets.WORKFLOW }}|base64 

    - name: 自动提交文件到仓库的 upload 目录
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        # 指定只提交 upload 文件夹下的内容
        file_pattern: 'upload/*'
        # 如果对应的文件没有发生任何变化，自动跳过而不报错
        skip_dirty_check: false
